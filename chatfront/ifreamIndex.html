<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chatfront - iframe 嵌套演示</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef1f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      .window {
        display: flex;
        flex-direction: column;
        width: 50vw;
        height: 50vh;
        min-width: 360px;
        min-height: 320px;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        border: 1px solid #d9dee7;
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        flex-shrink: 0;
        padding: 0 12px;
        background: #f4f6fa;
        border-bottom: 1px solid #e2e6ee;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .dot.red {
        background: #ff5f57;
      }

      .dot.yellow {
        background: #febc2e;
      }

      .dot.green {
        background: #28c840;
      }

      .title {
        flex: 1;
        font-size: 13px;
        color: #5b6472;
        text-align: center;
        user-select: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .titlebar-spacer {
        width: 45px;
        flex-shrink: 0;
      }

      .frame-body {
        flex: 1;
        min-height: 0;
        background: #ffffff;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="title">智能客服助手 — chatfront</div>
        <div class="titlebar-spacer"></div>
      </div>
      <div class="frame-body">
<!--        <div>-->
        <!-- 默认指向 vite dev server，请按实际端口调整 -->
        <iframe
          src="http://localhost:5173/"
          title="chatfront"
          allow="clipboard-write"
        ></iframe>
      </div>
    </div>
  </body>
</html>
