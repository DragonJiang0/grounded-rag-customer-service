# 单一前端入口：同时托管两套前端产物 + 两个后端反代前缀。
#   静态资源：
#     /apps/  -> front（管理后台）产物，深链回退 /apps/index.html
#     /chat/  -> chatfront（聊天窗口）产物，深链回退 /chat/index.html
#     /       -> 302 跳转到 /apps/
#   接口反代（portal 与 manage 是两个独立容器）：
#     /manage/*  -> manage:8080（去掉 /manage 前缀）
#     /portal/*  -> portal:9090（去掉 /portal 前缀）
server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS。用变量做 proxy_pass，后端容器重启换 IP 后可重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $manage_upstream "manage";
    set $portal_upstream "portal";

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # 相对跳转（Location: /apps/），避免被反代后误用 http:// 或内网端口
    absolute_redirect off;
    port_in_redirect off;

    # 域名根跳转到管理后台
    location = /      { return 302 /apps/; }
    location = /apps  { return 301 /apps/; }
    location = /chat  { return 301 /chat/; }

    # 管理后台接口 -> manage:8080（去掉 /manage 前缀）
    location /manage/ {
        rewrite ^/manage/?(.*)$ /$1 break;
        proxy_pass http://${manage_upstream}:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # front/src/api/sse.js 走 text/event-stream，必须关闭缓冲并放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天接口 -> portal:9090（去掉 /portal 前缀）
    location /portal/ {
        rewrite ^/portal/?(.*)$ /$1 break;
        proxy_pass http://${portal_upstream}:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # chatfront/src/utils/request.js 的 requestStream 走 SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 管理后台静态资源（vue-router createWebHistory 深链回退）
    location /apps/ {
        try_files $uri $uri/ /apps/index.html;
    }

    # 聊天静态资源（vue-router createWebHistory 深链回退）
    location /chat/ {
        try_files $uri $uri/ /chat/index.html;
    }
}
